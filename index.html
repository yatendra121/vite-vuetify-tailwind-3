<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store Admin</title>
    <meta name="description" content="Store Admin dashboard" />
    <meta property="og:title" content="Store Admin" />
    <meta property="og:description" content="Store Admin dashboard" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint; text uses a fallback until then. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <style>
      #initial_startup {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #fff;
        color: #525252;
        font: 500 16px 'DM Sans', system-ui, sans-serif;
      }
      #initial_startup.dark {
        background: #131c21;
        color: #f1f1f2;
      }
      #initial_startup i {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(128, 128, 128, 0.3);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }
      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="initial_startup" role="status">
      <i aria-hidden="true"></i>
      <span>Store Admin</span>
    </div>
    <script>
      // Match the saved theme so dark mode doesn't start with a white flash.
      try {
        var mode = JSON.parse(localStorage.getItem('app_customizer') || '{}')
          .settings?.mode
        if (
          mode === 'dark' ||
          ((!mode || mode === 'system') &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.getElementById('initial_startup').className = 'dark'
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
