# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'

      # pnpm v10+ ignores postinstall scripts unless they're allowed in
      # `pnpm-workspace.yaml`. This standalone repo isn't part of the
      # monorepo, so write the allow-list at job time. The list mirrors
      # the monorepo's pnpm-workspace.yaml#allowBuilds.
      - name: Allow trusted build scripts
        run: |
          cat > pnpm-workspace.yaml <<'EOF'
          allowBuilds:
            '@parcel/watcher': true
            core-js: true
            esbuild: true
            vue-demi: true
          EOF

      - run: pnpm install --no-frozen-lockfile

      - name: Unit Test
        run: pnpm test:unit run
